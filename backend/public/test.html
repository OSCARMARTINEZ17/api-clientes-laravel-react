<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <title>Gestión de Clientes</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                font-family: "Segoe UI", system-ui, sans-serif;
                background: #0f1115;
                color: #e8e8ea;
                max-width: 820px;
                margin: 0 auto;
                padding: 40px 24px 80px;
            }
            h1 {
                font-size: 28px;
                margin-bottom: 4px;
            }
            .subtitle {
                color: #8b8f9a;
                margin-bottom: 32px;
            }
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
            .card {
                background: #1a1d24;
                border: 1px solid #2a2e38;
                border-radius: 14px;
                padding: 22px;
            }
            .card h2 {
                font-size: 16px;
                margin: 0 0 16px;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            input {
                width: 100%;
                background: #0f1115;
                border: 1px solid #2a2e38;
                color: #e8e8ea;
                border-radius: 8px;
                padding: 10px 12px;
                margin-bottom: 10px;
                font-size: 14px;
            }
            input:focus {
                outline: none;
                border-color: #5b8cff;
            }
            button {
                width: 100%;
                border: none;
                border-radius: 8px;
                padding: 11px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                margin-top: 4px;
                transition: opacity 0.15s;
            }
            button:hover {
                opacity: 0.85;
            }
            .btn-primary {
                background: #5b8cff;
                color: #fff;
            }
            .btn-soft {
                background: #262b35;
                color: #e8e8ea;
                margin-bottom: 8px;
            }
            .btn-danger {
                background: #ff5b6a;
                color: #fff;
            }
            .row {
                display: flex;
                gap: 8px;
            }
            .row button {
                margin-top: 0;
            }
            .full {
                grid-column: 1 / -1;
            }
            pre {
                background: #0a0b0e;
                border: 1px solid #2a2e38;
                border-radius: 10px;
                padding: 16px;
                font-size: 13px;
                color: #7ee787;
                white-space: pre-wrap;
                max-height: 260px;
                overflow-y: auto;
            }
        </style>
    </head>
    <body>
        <h1>👥 Gestión de Clientes</h1>
        <p class="subtitle">Panel de pruebas para la API de api_clientes</p>

        <div class="grid">
            <div class="card">
                <h2>➕ Nuevo cliente</h2>
                <input id="nombre" placeholder="Nombre" />
                <input id="correo" placeholder="Correo" />
                <input id="telefono" placeholder="Teléfono" />
                <input id="ciudad" placeholder="Ciudad" />
                <button class="btn-primary" onclick="crear()">
                    Guardar cliente
                </button>
            </div>

            <div class="card">
                <h2>🔍 Buscar por ID</h2>
                <input
                    id="idCliente"
                    type="number"
                    placeholder="ID del cliente"
                />
                <div class="row">
                    <button class="btn-soft" onclick="ver()">Consultar</button>
                </div>
                <input id="ciudadNueva" placeholder="Nueva ciudad" />
                <button class="btn-soft" onclick="actualizar()">
                    Cambiar ciudad
                </button>
                <button class="btn-danger" onclick="eliminar()">
                    Eliminar cliente
                </button>
            </div>

            <div class="card full">
                <h2>📋 Todos los clientes</h2>
                <button class="btn-soft" onclick="listar()">
                    Actualizar lista
                </button>
                <pre id="resultado">La respuesta aparecerá aquí...</pre>
            </div>
        </div>

        <script>
            const BASE = "/api/clientes";

            function mostrar(data) {
                document.getElementById("resultado").textContent =
                    JSON.stringify(data, null, 2);
            }

            async function listar() {
                const res = await fetch(BASE);
                mostrar(await res.json());
            }

            async function crear() {
                const body = {
                    nombre: document.getElementById("nombre").value,
                    correo: document.getElementById("correo").value,
                    telefono: document.getElementById("telefono").value,
                    ciudad: document.getElementById("ciudad").value,
                };
                const res = await fetch(BASE, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                });
                mostrar(await res.json());
            }

            async function ver() {
                const id = document.getElementById("idCliente").value;
                const res = await fetch(`${BASE}/${id}`);
                mostrar(await res.json());
            }

            async function actualizar() {
                const id = document.getElementById("idCliente").value;
                const ciudad = document.getElementById("ciudadNueva").value;
                const res = await fetch(`${BASE}/${id}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ ciudad: ciudad }),
                });
                mostrar(await res.json());
            }

            async function eliminar() {
                const id = document.getElementById("idCliente").value;
                const res = await fetch(`${BASE}/${id}`, { method: "DELETE" });
                mostrar(await res.json());
            }
        </script>
    </body>
</html>
